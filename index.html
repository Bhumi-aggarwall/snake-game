<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="snake.css">
  <title>Snake-game</title>
</head>
<body>
 <main>
  <section>
    <div class="infos">
      <div class="info">
        <h3>High Score:
          <span id="high-score">0</span>
        </h3>
      </div>
      <div class="info">
        <h3>Score
          <span id="score">0</span>
        </h3>
      </div>
      <div class="info">
        <h3>Time
          <span id="time">00-00</span>
        </h3>
      </div>
    </div>
    <div class="board"></div>
  </section>

  <div class="modal">
    <div class="start-game">
      <h1>Welcome to Snake Game🐍</h1>
      <button class=" btn start-btn">Start Game</button>
    </div>
  </div>
  <div id="countdown"></div>
</main>
<div class="pause">
  <div class="pause-btn">
    <h1>Game Paused</h1>
    <p>Click Enter to Continue</p>
  </div>
</div>
<div class="restart">
  <div class="start-again">
    <h3>Game over</h3>
    <p class="best-line">Best score: <span id="final-best">0</span></p>
    <div class="final-score" id="final-score">0</div>
    <p class="score-label">Your score</p>
    <button id="restart-btn">Play again</button>
  </div>
</div>
  <script src="snake.js"></script>
</body>
</html>
